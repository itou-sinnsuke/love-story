<!DOCTYPE html>
<html lang="cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片库</title>
  <link rel="stylesheet" href="../css/photo.css">
  <link rel="icon" href="../img/icons/icon2.png">
  <script src="../js/love-days.js" defer></script>
  <script src="../js/photos.js" defer></script>
</head>
<body>
<header>
  <div class="title">
    <h1>这是属于我们的故事</h1>
    <h2>我们相识于2018年10月3日，距今已经<span id="love-days"></span>天啦！</h2>
  </div>
</header>
<nav class="navbar">
  <a href="../index.html">首页</a>
  <a href="photos.html" class="active">照片库</a>
  <a href="items.html">藏宝箱</a>
  <a href="message.html">留言板</a>
</nav>
<main>
  <div class="wall-header">
    <h2 class="wall-title">我们的时光</h2>
    <p class="wall-sub">每一张照片，都是我们故事的注脚</p>
  </div>
  <div class="photo-wall" id="photo-wall"></div>
</main>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close">×</button>
  <div class="lb-inner">
    <div class="lb-img-wrap">
      <img id="lb-img" src="" alt="">
    </div>
    <div class="lb-detail">
      <div class="lb-tag" id="lb-tag"></div>
      <h3 id="lb-title"></h3>
      <ul class="lb-meta">
        <li id="lb-date-row"><span class="meta-icon">📅</span><span id="lb-date"></span></li>
        <li id="lb-loc-row"><span class="meta-icon">📍</span><span id="lb-loc"></span></li>
      </ul>
      <p id="lb-desc"></p>
      <div class="lb-nav">
        <button id="lb-prev">&#8592; 上一张</button>
        <button id="lb-next">下一张 &#8594;</button>
      </div>
    </div>
  </div>
</div>
<footer class="site-footer">
  <p class="footer-line">
    这些故事，只属于我们
  </p>
  <p class="footer-copy">
    &copy;2026 王远志<br>本网站持续更新中
  </p>
</footer>
</body>
</html>
